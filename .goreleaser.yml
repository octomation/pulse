version: 2

project_name: pulse

archives:
  - id: pulse
    ids: [pulse, pulsectl]
    files:
      - LICENSE
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

# brews is deprecated upstream, but it is the only GoReleaser generator of a
# Formula, not a Cask: `brews` is deprecated upstream, but pulse ships as a
# Formula, and only a Formula has the service block that brew services runs:
# one package for the service and its client, as octopot/indexit and
# octomation/maintainer ship theirs. Keep GoReleaser pinned in CI.
brews:
  - name: pulse
    ids: [pulse]
    skip_upload: auto
    commit_author:
      use_github_app_token: true
    description: Morning paper of the GitHub trends that shows only what is new
    license: MIT
    directory: Formula
    homepage: https://pulse.octolab.org/
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    install: |
      bin.install "pulse"
      generate_completions_from_executable(bin/"pulse", "completion")
      bin.install "pulsectl"
      generate_completions_from_executable(bin/"pulsectl", "completion")
      prefix.install_metafiles
    service: |
      run macos: [opt_bin/"pulse"]
      keep_alive true
      working_dir Dir.home
      log_path var/"log/pulse.log"
      error_log_path var/"log/pulse.log"
    caveats: |
      Start the local service as your normal user:
        brew services start octolab/tap/pulse
      Then open http://pulse.localhost:17842/
      The service does not see the variables of your shell: the GitHub token
      of the reader goes into ~/.config/pulse/config.toml, as
      https://pulse.octolab.org/trend-watch/ shows.
    test: |
      system "#{bin}/pulse", "version"
      system "#{bin}/pulse", "--help"
      system "#{bin}/pulsectl", "version"

builds:
  - id: pulse
    binary: pulse
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: ./cmd/pulse
  - id: pulsectl
    binary: pulsectl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: ./cmd/pulsectl

checksum: { name_template: checksums.txt }

release:
  # the repository comes from the git remote; the title from the release note,
  # see .github/scripts/release.mjs render
  name_template: '{{ envOrDefault "RELEASE_TITLE" .Tag }}'
  # a prerelease tag (vX.Y.Z-rcN) is published as a prerelease, never as Latest
  prerelease: auto
  preflight:
    fail_on_error: true
