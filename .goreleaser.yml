version: 2

project_name: pulse

archives:
  - id: pulse
    ids:
      - pulse
      - pulsectl
    files:
      - LICENSE
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

# brews is deprecated upstream, but it is the only GoReleaser generator of a
# Formula (as octopot/indexit and octomation/maintainer). Keep GoReleaser
# pinned in CI.
brews:
  - name: pulse
    ids: [pulse]
    # a prerelease tag (vX.Y.Z-rcN) leaves the tap as it is
    skip_upload: auto
    commit_author:
      use_github_app_token: true
    description: "The pulse service and its client, pulsectl."
    directory: Formula
    homepage: https://github.com/octomation/tablo
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    install: |
      bin.install "pulse"
      generate_completions_from_executable(bin/"pulse", "completion")
      bin.install "pulsectl"
      generate_completions_from_executable(bin/"pulsectl", "completion")
      prefix.install_metafiles
    test: |
      system "#{bin}/pulse", "version"
      system "#{bin}/pulsectl", "version"

builds:
  - id: pulse
    binary: pulse
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: ./cmd/server
  - id: pulsectl
    binary: pulsectl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: ./cmd/client

checksum: { name_template: checksums.txt }

release:
  # the repository comes from the git remote; a prerelease tag (vX.Y.Z-rcN)
  # is published as a prerelease, never as Latest
  prerelease: auto
